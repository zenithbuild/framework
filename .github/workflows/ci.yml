name: ci

on:
  workflow_dispatch:
    inputs:
      diagnosticsOnly:
        description: Run only the consumer resolver diagnostic
        type: boolean
        default: false
  pull_request:
    branches:
      - train
      - master
      - beta
      - integration/v1
  push:
    branches:
      - beta
      - train
      - master

permissions:
  contents: read

jobs:
  diagnose:
    uses: ./.github/workflows/diagnose-consumer.yml
  ci:
    if: ${{ !inputs.diagnosticsOnly }}
    uses: ./.github/workflows/reusable-ci.yml
    secrets: inherit
