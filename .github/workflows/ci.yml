name: ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - train
      - master
      - beta
      - integration/v1
  push:
    branches:
      - beta
      - train
      - master

permissions:
  contents: read

jobs:
  diagnose:
    uses: ./.github/workflows/diagnose-consumer.yml
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    secrets: inherit
