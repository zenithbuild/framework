name: Diagnose isolated core consumer
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/**/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/**/Cargo.lock', 'packages/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: bun install --frozen-lockfile
      - run: ls -ld packages/core/node_modules/@zenithbuild/bundler packages/cli/node_modules/@zenithbuild/bundler && ls -la packages/core/node_modules/@zenithbuild/bundler/
      - name: Build JavaScript entries without native compilation
        run: |
          bun run --cwd packages/runtime build
          bun run --cwd packages/router build
          bun run --cwd packages/core build
          bun run --cwd packages/cli build
          bun build packages/compiler/meta/index.ts --outdir packages/compiler/dist --target node --format esm
          node node_modules/typescript/bin/tsc -p packages/bundler/tsconfig.meta.json
      - run: node scripts/diagnose-core-consumer.mjs
