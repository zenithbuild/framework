name: Site dependency security

on:
  pull_request:
    branches: [integration/v1]
    paths:
      - 'site/package.json'
      - 'site/bun.lock'
      - 'site/tina/**'
      - 'site/src/public/admin/**'
      - 'scripts/security/site-dependency-security.spec.mjs'
      - '.github/workflows/validate-site-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail, so `| tee` cannot hide a failed command.
defaults:
  run:
    shell: bash

jobs:
  site-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install the site lockfile without changes
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Exercise the installed security boundaries
        run: node --test scripts/security/site-dependency-security.spec.mjs
      - name: Generate schema, client and production admin assets
        run: bun run --cwd site cms:build 2>&1 | tee site-cms-build.log
      - name: Record generated artifact changes
        run: git diff --numstat -- site/src/public/admin site/tina/__generated__ > site-cms-generated-diff.txt
      - name: Audit the committed CMS content
        run: bun run --cwd site cms:audit 2>&1 | tee site-cms-content-audit.log
      - name: Verify content loading and documentation contracts
        working-directory: site
        run: bun test tests/tina-cms-integration.test.ts tests/documentation-architecture.test.ts tests/search-index.test.ts
      - name: Keep every active root and site advisory blocking
        if: always()
        run: |
          audit_status=0
          bun audit --json > root-audit.json || audit_status=$?
          (cd site && bun audit --json) > site-audit.json || audit_status=$?
          cat root-audit.json site-audit.json
          exit "$audit_status"
      - name: Retain audit and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dependency-security-${{ github.sha }}
          path: |
            root-audit.json
            site-audit.json
            site-cms-*.log
            site-cms-generated-diff.txt
            site/src/public/admin
            site/tina/__generated__
